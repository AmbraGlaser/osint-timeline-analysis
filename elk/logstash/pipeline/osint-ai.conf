# Verwerkt de nieuwste AI-verrijkte OSINT JSONL-export.

input {
  file {
    path => "/usr/share/logstash/input/latest_osint_ai.jsonl"

    # File input geeft regels een voor een door; elke regel is een volledig JSON-object.
    codec => json

    start_position => "beginning"

    # Lees opnieuw bij herstart; document_id voorkomt dubbele documenten.
    sincedb_path => "/dev/null"

    mode => "read"
    file_completed_action => "log"
    file_completed_log_path => "/tmp/logstash_completed.log"
   
  }
}

filter {
  # Gebruikt published_at als Kibana-tijdveld wanneer mogelijk.
  if [published_at] {
    date {
      match => ["published_at", "ISO8601", "yyyy-MM-dd HH:mm:ss", "yyyy-MM-dd"]
      target => "@timestamp"
      tag_on_failure => ["published_at_parse_failed"]
    }
  }

  if [ai_score] {
    mutate {
      convert => { "ai_score" => "float" }
    }
  }

  if [ai_location_count] {
    mutate {
      convert => { "ai_location_count" => "integer" }
    }
  }

  if [scrape_version] {
    mutate {
      convert => { "scrape_version" => "integer" }
    }
  }

  if [ai_output_version] {
    mutate {
      convert => { "ai_output_version" => "integer" }
    }
  }

  # Stabiele IDs maken herhaalde imports idempotent.
  fingerprint {
    method => "SHA256"
    source => ["platform", "title", "text", "published_at", "source_category", "ai_label", "ai_score", "ai_detected_locations", "ai_location_count", "scrape_version", "ai_output_version"]
    concatenate_sources => true
    target => "[@metadata][document_id]"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]

    index => "osint-results"

    manage_template => true
    template_name => "osint-results-template"
    template => "/usr/share/logstash/templates/osint-results-template.json"
    template_overwrite => true

    document_id => "%{[@metadata][document_id]}"
  }
}
